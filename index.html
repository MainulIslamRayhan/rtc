  :root { --red:#0559ff; --dark:#021744; --ink:#2a2a2a; --bg:#eceff1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); font-family:'Hind Siliguri',sans-serif; color:var(--ink); }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:12px; position:sticky; top:0; background:#fff; box-shadow:0 1px 4px #0002; z-index:5; }
  .toolbar button { font:inherit; padding:9px 14px; border:0; border-radius:8px; background:var(--red); color:#fff; cursor:pointer; }
  .toolbar button.alt { background:var(--dark); }
  .stage { padding:14px 0 40px; display:flex; justify-content:center; }
  .scaler { transform-origin:top center; }

  /* A5 landscape ≈ 794 x 559 px */
  #receipt { width:794px; height:559px; background:#fff; position:relative; overflow:hidden; box-shadow:0 2px 12px #0003; }
  .deco { position:absolute; }
  .d1 { top:0; left:70px; width:250px; height:26px; background:var(--dark); clip-path:polygon(0 0,100% 0,93% 100%,12% 100%); }
  .d2 { top:0; left:310px; width:270px; height:26px; background:var(--red); clip-path:polygon(0 0,100% 0,96% 100%,4% 100%); }
  .d3 { top:0; right:0; width:110px; height:90px; background:var(--red); clip-path:polygon(100% 0,100% 100%,0 0); }
  .d4 { top:0; right:0; width:60px; height:45px; background:#003a96; clip-path:polygon(100% 0,100% 100%,0 0); }

  .title { position:absolute; top:62px; left:66px; font:400 34px 'Anton',sans-serif; color:var(--red); letter-spacing:.5px; }
  .logo { position:absolute; top:62px; right:58px; width:104px; height:104px; border-radius:50%; background:#fff; cursor:pointer; overflow:hidden; }
  .logo img { width:100%; height:100%; object-fit:contain; }
  .red { color:var(--red); }

  .date { position:absolute; top:118px; left:66px; right:62px; display:flex; align-items:flex-end; gap:8px; font-size:16px; font-weight:500; }
  .date input { width:44px; text-align:center; border:0; border-bottom:1.5px dashed #1c3a7a; background:transparent; font:inherit; color:#111; outline:none; border-radius:0; }
  .date input.y { width:60px; }
  .date select { width:58px; text-align:center; text-align-last:center; border:0; border-bottom:1.5px dashed #1c3a7a; background:transparent; font:inherit; color:#111; outline:none; border-radius:0; -webkit-appearance:none; appearance:none; padding:0; }
  .num { position:absolute; top:128px; left:420px; font-size:11px; }
  .num input { border:0; width:80px; font:inherit; background:transparent; }

  .wm { position:absolute; left:232px; top:128px; width:330px; height:330px; border-radius:50%; opacity:.09; pointer-events:none; }
  .body { position:absolute; top:150px; left:66px; right:62px; display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; align-items:flex-end; gap:8px; font-size:16px; font-weight:500; line-height:1.2; height:23px; }
  .row label { white-space:nowrap; }
  .row input { flex:1; min-width:0; border:0; border-bottom:1.5px dashed #1c3a7a; background:transparent; font:inherit; font-size:16px; padding:0 4px 1px; color:#111; outline:none; border-radius:0; }
  .row input:disabled { opacity:.45; }
  .row.end { justify-content:flex-end; align-items:center; }
  .row.end #fine { flex:none; width:90px; } .row.end #total { flex:none; width:120px; font-weight:600; }
  .row.pay { align-items:center; gap:12px; }
  .row input { height:22px; line-height:1.2; }

  table.acc { width:100%; border-collapse:collapse; font-size:15px; line-height:1.2; flex:none; }
  table.acc th { background:#e8f0ff; color:var(--red); font-weight:600; font-size:14px; text-align:left; padding:0 6px; height:22px; line-height:1.2; border:1px solid #8aa6e6; }
  table.acc td { border:1px solid #8aa6e6; padding:0; height:22px; }
  table.acc td.sl { width:28px; text-align:center; color:#666; font-size:13px; }
  table.acc th.a { width:170px; } table.acc th.m { width:110px; }
  table.acc input { width:100%; height:21px; line-height:1.2; border:0; background:transparent; font:inherit; font-size:15px; padding:0 6px; color:#111; outline:none; border-radius:0; }

  #receipt.tight .body { gap:2px; }
  #receipt.tight .row { height:21px; }
  #receipt.tight .row input { height:20px; }
  #receipt.tight table.acc th, #receipt.tight table.acc td { height:19px; }
  #receipt.tight table.acc input { height:18px; }

  .cb { display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap; user-select:none; }
  .box { width:15px; height:15px; border:1.8px solid var(--red); border-radius:3px; display:inline-block; position:relative; flex:none; background:#fff; }
  .cb.on .box { background:var(--red); }
  .cb.on .box::after { content:''; position:absolute; left:3.5px; top:0; width:4px; height:9px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); }
  .sub { display:inline-flex; align-items:center; gap:10px; font-size:14px; }

  .foot { position:absolute; top:448px; line-height:1.2; font-size:16px; color:var(--red); font-weight:500; }
  .f1 { left:155px; } .f2 { left:432px; }
  .sig { position:absolute; top:468px; left:100px; width:200px; height:46px; }
  .sig input { width:100%; height:100%; border:0; border-bottom:1.5px dotted #777; background:transparent; font-family:'Modernline','Hind Siliguri',cursive; font-size:28px; color:#021744; text-align:center; outline:none; padding:0 0 2px; border-radius:0; }

  @page { size: A5 landscape; margin:0; }
  @media print {
    body { background:#fff; }
    .toolbar { display:none; }
    .stage { padding:0; }
    .scaler { transform:none !important; }
    #receipt { box-shadow:none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="downloadPDF()">PDF ডাউনলোড</button>
  <button class="alt" onclick="printIt()">প্রিন্ট</button>
  <button class="alt" onclick="newReceipt()">নতুন রসিদ</button>
  <button class="alt" onclick="setRows(rows+1)">+ অ্যাকাউন্ট</button>
  <button class="alt" onclick="setRows(rows-1)">− অ্যাকাউন্ট</button>
  <button class="alt" onclick="toggleLang()" id="langBtn">বাংলা</button>
  <button class="alt" onclick="document.getElementById('logoFile').click()">লোগো দিন</button>
  <input type="file" id="logoFile" accept="image/*" hidden>
</div>

<div class="stage"><div class="scaler" id="scaler">
<div id="receipt">
  <img id="wm" class="wm" alt="">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const fields = ['dd','mm','yy','no','from','fine','total','check','for','by','prev','cur'];
const safe = (fn) => { try { return fn(); } catch(e) { return null; } };
const num = v => parseFloat(String(v).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/,/g,'')) || 0;

// ---- scale to fit screen
function fit() {
  const s = Math.min(1, (window.innerWidth - 16) / 794);
  const sc = $('scaler');
  sc.style.transform = 'scale(' + s + ')';
  sc.style.height = (559 * s) + 'px';
  sc.style.width = (794 * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---- account rows (1 to 4)
let rows = 3;
const accRows = () => [...document.querySelectorAll('.acc-row')];
function setRows(n) {
  rows = Math.max(1, Math.min(4, n));
  accRows().forEach((tr, i) => {
    tr.style.display = i < rows ? '' : 'none';
    if (i >= rows) tr.querySelectorAll('input').forEach(x => x.value = '');
  });
  calc();
  fitBody();
}
// keep the table + fields from running into the footer (Received by / Stamp)
function fitBody() {
  const r = $('receipt'), b = document.querySelector('.body');
  r.classList.remove('tight');
  if (b.offsetTop + b.offsetHeight > 438) r.classList.add('tight');
}
document.querySelectorAll('.am').forEach(x => x.addEventListener('input', calc));
$('fine').addEventListener('input', calc);
$('prev').addEventListener('input', () => { prevTouched = $('prev').value !== ''; calc(); });

// ---- previous deposit: remembered per name (this browser)
let prevTouched = false;
const BKEY = 'rc_bal';
const bal = () => safe(() => JSON.parse(localStorage.getItem(BKEY))) || {};
const nk = s => s.trim().toLowerCase().replace(/\s+/g, ' ');
function refreshNames() {
  $('names').innerHTML = '';
  Object.values(bal()).forEach(v => { const o = document.createElement('option'); o.value = v.name; $('names').appendChild(o); });
}
function saveBal() {
  const k = nk($('from').value);
  if (!k || $('cur').value === '') return;
  const m = bal();
  m[k] = { name: $('from').value.trim(), cur: num($('cur').value), no: $('no').value };
  safe(() => localStorage.setItem(BKEY, JSON.stringify(m)));
  refreshNames();
}
$('from').addEventListener('input', () => {
  if (prevTouched) return;
  const b = bal()[nk($('from').value)];
  $('prev').value = b ? b.cur : '';
  calc();
});
function printIt() { saveBal(); window.print(); }
refreshNames();

// ---- payment ticks & late fine
let pay = {main:null, sub:null}, late = false;
function renderTicks() {
  document.querySelectorAll('.cb').forEach(el => {
    const k = el.dataset.k;
    el.classList.toggle('on', k === pay.main || k === pay.sub || (k === 'late' && late));
  });
  $('fine').disabled = !late;
  calc();
}
function calc() {
  let t = 0;
  accRows().forEach((tr, i) => { if (i < rows) t += num(tr.querySelector('.am').value); });
  if (late) t += num($('fine').value);
  $('total').value = t ? t : '';
  const p = num($('prev').value); $('cur').value = (p || t) ? p + t : '';
}
document.addEventListener('click', e => {
  const el = e.target.closest('.cb'); if (!el) return;
  const k = el.dataset.k;
  if (['cash','mobile','bank'].includes(k)) { pay.main = pay.main === k ? null : k; if (pay.main !== 'mobile') pay.sub = null; }
  else if (['bkash','nagad','rocket'].includes(k)) { if (pay.sub === k) pay.sub = null; else { pay.sub = k; pay.main = 'mobile'; } }
  else if (k === 'late') { late = !late; if (!late) $('fine').value = ''; else $('fine').focus(); }
  renderTicks();
});

// ---- defaults
function today() {
  const d = new Date();
  $('dd').value = String(d.getDate()).padStart(2,'0');
  $('mm').value = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  $('yy').value = d.getFullYear();
}
function newReceipt() {
  prevTouched = false;
  fields.forEach(f => $(f).value = '');
  document.querySelectorAll('.acc-row input').forEach(x => x.value = '');
  pay = {main:null, sub:null}; late = false; setRows(3); renderTicks();
  today();
  const n = (parseInt(safe(() => localStorage.getItem('rc_no')) || '0', 10) || 0) + 1;
  $('no').value = n;
  safe(() => localStorage.setItem('rc_no', n));
}

// ---- logo
function setLogo(src) { $('logo').innerHTML = '<img src="' + src + '" alt="logo">'; $('wm').src = src; }
$('logoFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { setLogo(r.result); safe(() => localStorage.setItem('rc_logo', r.result)); };
  r.readAsDataURL(f);
});
const savedLogo = safe(() => localStorage.getItem('rc_logo'));
if (savedLogo) setLogo(savedLogo);
$('wm').src = $('logo').querySelector('img').src;

// ---- language toggle
let lang = safe(() => localStorage.getItem('rc_lang')) || 'en';
function applyLang() {
  document.querySelectorAll('[data-en]').forEach(el => el.textContent = el.dataset[lang]);
  $('langBtn').textContent = lang === 'en' ? 'বাংলা' : 'English';
  fitBody();
}
function toggleLang() {
  lang = lang === 'en' ? 'bn' : 'en';
  safe(() => localStorage.setItem('rc_lang', lang));
  applyLang();
}
applyLang();

// ---- start
newReceipt();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBody);

// ---- PDF
function downloadPDF() {
  const sc = $('scaler'), old = sc.style.transform;
  sc.style.transform = 'none';
  saveBal();
  const name = 'receipt-' + ($('no').value || 'new') + '.pdf';
  const go = () => html2pdf().set({
    margin: 0, filename: name,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 3, useCORS: true, scrollX: 0, scrollY: 0 },
    jsPDF: { unit: 'mm', format: 'a5', orientation: 'landscape' }
  }).from($('receipt')).save().then(() => { sc.style.transform = old; });
  Promise.all([document.fonts.load('28px "Modernline"'), document.fonts.ready]).then(go, go);
}
</script>
</body>
</html>
